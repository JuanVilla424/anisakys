# Single source of truth for dependencies (PEP 621 metadata, PEP 735 groups),
# locked with Poetry >= 2.2 in poetry.lock. After editing dependencies run:
#   poetry lock && tools/sync-requirements.sh
# which regenerates requirements.txt / requirements-dev.txt from the lock
# (needs `poetry self add poetry-plugin-export`). CI fails when poetry.lock or
# the requirements files are out of sync with this file.
[project]
name = "anisakys"
version = "1.1.2"
description = "Open Phishing Monitor Daemon. Scan similar domains based on world keys."
authors = [{ name = "B", email = "g46327wsj1.marbling129@passinbox.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.18,<2",
    "beautifulsoup4>=4.12,<5",
    "boto3>=1.34,<2",
    "confusable-homoglyphs>=3.3,<4",
    "dnspython>=2.7,<2.8",
    "dnstwist>=20240201",
    "flask>=3.1.3,<3.2",
    "flask-limiter>=4.1,<5",
    "google-api-python-client>=2.197,<3",
    "google-auth>=2.23,<3",
    "gunicorn>=23.0",
    "idna>=3.10,<4",
    "ipwhois>=1.2,<2",
    "jinja2>=3.1.6,<4",
    "mmh3>=5.3,<6",
    "numpy>=2.3,<3",
    "pillow>=12.0,<13",
    "playwright>=1.40,<2",
    "prometheus-client>=0.21.1,<0.22",
    "psutil>=6.1.1",
    "psycopg2-binary>=2.9.10,<2.10",
    "pydantic>=2.9.1,<3",
    "pydantic-settings>=2.0,<3",
    "pymisp>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "python-whois>=0.9.4",
    "rapidfuzz>=3.14,<4",
    "redis>=5.0",
    "requests>=2.33,<2.35",
    "selenium>=4.15,<5",
    "serpapi>=0.1.5",
    "sqlalchemy>=2.0.48,<2.1",
    "stix2>=3.0,<4",
    "tldextract>=5.1,<6",
    "urllib3>=2.2,<3",
    "validators>=0.35,<0.36",
    "websocket-client>=1.8,<2",
    "werkzeug>=3.1,<4",
    "zxing-cpp>=3.1,<4",
]

[dependency-groups]
dev = [
    # Formatter, linter and type checker are pinned exactly so that local
    # runs, pre-commit and CI agree byte for byte.
    "black==26.5.1",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-timeout>=2.3,<3",
    "coverage>=7.6,<8",
    "pip-audit>=2.7,<3",
    "pre-commit>=4.0,<5",
    "pylint>=4.0.5,<5",
    "yamllint>=1.35,<2",
    "bump2version>=1.0,<2",
    "toml>=0.10,<0.11",
]

[tool.poetry]
# An application, not a library: `poetry install` only installs dependencies.
package-mode = false
requires-poetry = ">=2.2"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "smtp-relay", "alembic/versions"]

[tool.ruff.lint]
# Pyflakes (F) is the blocking gate in CI. The wider rule set below is the
# target for new and modified code (see docs/ROADMAP.md, phase 6).
select = ["F"]
extend-select = []

[tool.ruff.lint.per-file-ignores]
# src.main is a backwards-compatible facade: tests and scripts import many
# names through it, so its re-exports are intentional.
"src/main.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint]
rcfile = ".pylintrc"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
