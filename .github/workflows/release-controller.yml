---
# .github/workflows/release-controller.yml

name: Release Controller

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      REPO_NAME: ${{ github.event.repository.name }}
  # set folder repository var \
  #  (settings->security->secrets-variables->actions->variables->repository) \
  #  or set default
      FOLDER_TO_COMPRESS: 'docs'
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package Version
        id: package_version
        run: |
          zip -r "${REPO_NAME}-${GITHUB_REF_NAME}.zip" \
            {INSTALL,SECURITY,README,ICONS,CONTRIBUTING,CODE_OF_CONDUCT}.md \
            requirements.txt .github scripts frontend backend \
            pyproject.toml LICENSE
#            "${FOLDER_TO_COMPRESS}"
        env:
          REPO_NAME: ${{ env.REPO_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FOLDER_TO_COMPRESS: ${{ env.FOLDER_TO_COMPRESS }}
      # actions/create-release and actions/upload-release-asset are archived;
      # the preinstalled GitHub CLI does the same in one step.
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ env.REPO_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${REPO_NAME}-${GITHUB_REF_NAME}.zip#${REPO_NAME}-${GITHUB_REF_NAME}.zip" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
