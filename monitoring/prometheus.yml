global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: anisakys
    static_configs:
      - targets:
          - 172.17.0.1:8091
    metrics_path: /metrics
    scrape_timeout: 10s
    # /metrics requires a bearer token: the backend's METRICS_TOKEN (or an API
    # key with the "metrics" scope) stored in monitoring/secrets/metrics_token.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
