[pytest]
pythonpath = .
testpaths = tests
# Live-network tests are opt-in: `pytest -m network` runs only them and
# `pytest -m ""` runs everything. --strict-markers rejects unregistered marks.
addopts = -m "not network" --strict-markers
markers =
    network: talks to real external services (SMTP, MX/DNS, WHOIS, websites); excluded by default
    slow: slow tests (e.g. migration tests that create throw-away databases)
# Default per-test timeout (pytest-timeout); override with --timeout.
timeout = 120
log_cli = true
log_cli_level = INFO
