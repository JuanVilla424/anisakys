---
# Anisakys stack demo local — todo orquestado desde el repo del backend.
# Levanta: PostgreSQL + backend (este repo) + frontend (../anisakys-frontend).
name: anisakys-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [anisakys-net]

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # Containers log to stdout (docker logs); no per-process log files.
      LOG_DIR: ""
    volumes:
      - ./queries.txt:/app/queries.txt:ro
      - ./entrypoint-backend.sh:/app/entrypoint-backend.sh:ro
    command: ["sh", "/app/entrypoint-backend.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8091:8091"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [anisakys-net]

  # Background jobs (abuse reporting, outbox delivery, follow-ups, takedown
  # monitor, GSB rescan, schedulers). The API container only serves HTTP, so
  # without this service nothing is reported or verified. Starts after the
  # backend is healthy, i.e. after migrations ran.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      LOG_DIR: ""
      PROCESS_ROLE: scheduler
    command: ["python", "anisakys.py", "--role", "scheduler"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [anisakys-net]

  frontend:
    build:
      context: ../anisakys-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ["5174:80"]
    networks: [anisakys-net]

volumes:
  pgdata:

networks:
  anisakys-net:
    driver: bridge
