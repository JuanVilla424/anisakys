---
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: anisakys-db
    environment:
      POSTGRES_USER: ${DB_USER:-anisakys}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anisakys_password}
      POSTGRES_DB: ${DB_NAME:-anisakys}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5591:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anisakys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anisakys-network

  # Anisakys Backend API
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: anisakys-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-anisakys}:${DB_PASSWORD:-anisakys_password}@postgres:5432/${DB_NAME:-anisakys}
      - ANISAKYS_API_KEY=${ANISAKYS_API_KEY:-your_api_key_here}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1125}
      - ABUSE_EMAIL_SENDER=${ABUSE_EMAIL_SENDER:-abuse@example.com}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./database:/app/database
      - ./templates:/app/templates
    networks:
      - anisakys-network
    restart: unless-stopped
    command: ["python", "src/main.py", "--start-api", "--api-port", "8080", "--api-key", "${ANISAKYS_API_KEY:-your_api_key_here}"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Anisakys Web Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anisakys-web
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    ports:
      - "8084:80"
    depends_on:
      - backend
    networks:
      - anisakys-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  anisakys-network:
    driver: bridge
