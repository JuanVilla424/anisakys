version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: anisakys-db
    environment:
      POSTGRES_USER: ${DB_USER:-anisakys}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anisakys_password}
      POSTGRES_DB: ${DB_NAME:-anisakys}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anisakys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anisakys-network

  # Anisakys Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anisakys-backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-anisakys}:${DB_PASSWORD:-anisakys_password}@postgres:5432/${DB_NAME:-anisakys}
      - ANISAKYS_API_KEY=${ANISAKYS_API_KEY:-your_api_key_here}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - URLVOID_API_KEY=${URLVOID_API_KEY}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY}
      - GRINDER0X_API_URL=${GRINDER0X_API_URL}
      - GRINDER0X_API_KEY=${GRINDER0X_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1125}
      - ABUSE_EMAIL_SENDER=${ABUSE_EMAIL_SENDER:-abuse@example.com}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/app/database
      - ./templates:/app/templates
    networks:
      - anisakys-network
    restart: unless-stopped

  # Anisakys Web Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anisakys-web
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - anisakys-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  anisakys-network:
    driver: bridge
